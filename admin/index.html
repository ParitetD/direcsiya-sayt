<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Панель управления — Дирекция спорта КР</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

<!-- ═══ LOGIN ═══ -->
<div id="login-screen" class="login-screen">
  <div class="login-bg" aria-hidden="true"></div>
  <div class="login-card">
    <div class="login-brand">
      <div class="login-emblem" aria-hidden="true">
        <svg width="52" height="52" viewBox="0 0 52 52" fill="none">
          <circle cx="26" cy="26" r="24" stroke="#C8963E" stroke-width="1.5" opacity=".5"/>
          <circle cx="26" cy="26" r="16" stroke="#8B2500" stroke-width="1.5"/>
          <line x1="26" y1="2" x2="26" y2="50" stroke="#8B2500" stroke-width="1.2" opacity=".4"/>
          <line x1="2" y1="26" x2="50" y2="26" stroke="#8B2500" stroke-width="1.2" opacity=".4"/>
          <circle cx="26" cy="26" r="5" fill="#8B2500"/>
        </svg>
      </div>
      <div>
        <h1 class="login-title">Дирекция спорта КР</h1>
        <p class="login-sub">Система управления сайтом</p>
      </div>
    </div>
    <form id="login-form" onsubmit="handleLogin(event)" autocomplete="off">
      <div class="field">
        <label class="field-lbl">Логин</label>
        <div class="field-wrap">
          <svg class="field-ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <input type="text" id="login-username" placeholder="admin" autocomplete="username" required>
        </div>
      </div>
      <div class="field">
        <label class="field-lbl">Пароль</label>
        <div class="field-wrap">
          <svg class="field-ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password" required>
          <button type="button" class="field-eye" onclick="togglePassword()" tabindex="-1" aria-label="Показать пароль">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <div id="login-error" class="login-err hidden"></div>
      <button type="submit" class="btn-login" id="login-btn">Войти в систему</button>
    </form>
    <p class="login-hint">По умолчанию: admin / admin123</p>
  </div>
</div>

<!-- ═══ APP ═══ -->
<div id="app" class="app hidden">

  <!-- Sidebar -->
  <aside class="sb" id="sidebar">
    <div class="sb-top">
      <div class="sb-brand">
        <img src="/logo.png" alt="ДНВС" style="width:36px;height:36px;object-fit:contain;border-radius:50%;flex-shrink:0" onerror="this.style.display='none'">
        <div class="sb-brand-txt">
          <span class="sb-bname">Дирекция спорта</span>
          <span class="sb-brole">Панель управления</span>
        </div>
      </div>
      <button class="sb-close-btn" onclick="toggleSidebar()" aria-label="Закрыть">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <nav class="sb-nav">
      <p class="sb-group-lbl">Контент</p>
      <a href="#dashboard" class="sb-item" data-section="dashboard">
        <svg class="sb-ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
        <span>Дашборд</span>
      </a>
      <a href="#news" class="sb-item" data-section="news">
        <svg class="sb-ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        <span>Новости</span>
        <span class="sb-badge" id="badge-news"></span>
      </a>
      <a href="#events" class="sb-item" data-section="events">
        <svg class="sb-ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <span>Мероприятия</span>
        <span class="sb-badge" id="badge-events"></span>
      </a>
      <a href="#gallery" class="sb-item" data-section="gallery">
        <svg class="sb-ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        <span>Галерея</span>
        <span class="sb-badge" id="badge-gallery"></span>
      </a>
      <a href="#people" class="sb-item" data-section="people">
        <svg class="sb-ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span>Люди</span>
        <span class="sb-badge" id="badge-people"></span>
      </a>
      <a href="#slides" class="sb-item" data-section="slides">
        <svg class="sb-ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="15" rx="2"/><polyline points="17 2 12 7 7 2"/></svg>
        <span>Слайдер</span>
        <span class="sb-badge" id="badge-slides"></span>
      </a>
      <a href="#sports" class="sb-item" data-section="sports">
        <svg class="sb-ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89L17 22l-5-3-5 3 1.523-9.11"/></svg>
        <span>Виды спорта</span>
        <span class="sb-badge" id="badge-sports"></span>
      </a>
      <p class="sb-group-lbl" style="margin-top:8px">Система</p>
      <a href="#settings" class="sb-item" data-section="settings">
        <svg class="sb-ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>Настройки</span>
      </a>
    </nav>

    <div class="sb-foot">
      <div class="sb-user-block">
        <div class="sb-avatar" id="sb-avatar">A</div>
        <div class="sb-user-info">
          <span id="sb-uname" class="sb-uname">admin</span>
          <span class="sb-urole">Администратор</span>
        </div>
      </div>
      <button class="sb-logout" onclick="logout()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Выйти
      </button>
    </div>
  </aside>

  <div class="sb-overlay" id="sb-overlay" onclick="toggleSidebar()"></div>

  <!-- Main -->
  <div class="main" id="main">
    <header class="topbar">
      <button class="burger" onclick="toggleSidebar()" aria-label="Меню">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="topbar-crumb">
        <span class="crumb-root">Управление</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
        <span id="topbar-section" class="crumb-cur">Дашборд</span>
      </div>
      <div class="topbar-end">
        <a href="/" target="_blank" rel="noopener" class="topbar-site-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          Открыть сайт
        </a>
        <div class="topbar-avatar" id="topbar-avatar">A</div>
      </div>
    </header>
    <main class="content" id="content">
      <div class="loading-wrap"><div class="loading-spinner"></div></div>
    </main>
  </div>
</div>

<!-- ═══ DRAWER ═══ -->
<div class="drawer-bg" id="drawer-bg" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <div class="drawer-head-txt">
      <h3 id="drawer-title">Новая запись</h3>
      <p id="drawer-hint" class="drawer-hint"></p>
    </div>
    <button class="drawer-x" onclick="closeDrawer()" aria-label="Закрыть">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
  <div class="drawer-foot" id="drawer-foot"></div>
</div>

<!-- ═══ CONFIRM DIALOG ═══ -->
<div class="dialog-wrap hidden" id="dialog-wrap">
  <div class="dialog-overlay" onclick="closeConfirm()"></div>
  <div class="dialog" id="dialog"></div>
</div>

<!-- ═══ TOASTS ═══ -->
<div id="toasts" class="toasts" aria-live="polite"></div>

<script src="js/admin.js"></script>
</body>
</html>
