<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Страница не найдена</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 60'><circle cx='30' cy='30' r='28' fill='none' stroke='%238B2500' stroke-width='3'/><circle cx='30' cy='30' r='12' fill='none' stroke='%238B2500' stroke-width='2'/><circle cx='30' cy='30' r='5' fill='%238B2500'/></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-primary: #8B2500;
            --color-secondary: #C8963E;
            --color-accent: #1B4332;
            --color-cream: #FFFDF7;
            --color-sand: #F5E6C8;
            --color-text: #2C2C2C;
            --font-heading: 'Playfair Display', Georgia, serif;
            --font-body: 'Raleway', 'Helvetica Neue', sans-serif;
        }
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font-body);
            background: var(--color-cream);
            color: var(--color-text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 6px;
            background: repeating-linear-gradient(
                90deg,
                var(--color-primary) 0px, var(--color-primary) 20px,
                var(--color-secondary) 20px, var(--color-secondary) 40px,
                var(--color-accent) 40px, var(--color-accent) 60px
            );
        }
        .ornament {
            width: 120px;
            height: 120px;
            margin-bottom: 2rem;
            opacity: 0.15;
        }
        .error-code {
            font-family: var(--font-heading);
            font-size: clamp(6rem, 15vw, 12rem);
            font-weight: 900;
            color: var(--color-primary);
            line-height: 1;
            letter-spacing: -0.02em;
            position: relative;
        }
        .error-code::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 4px;
            background: var(--color-secondary);
            border-radius: 2px;
        }
        h1 {
            font-family: var(--font-heading);
            font-size: clamp(1.4rem, 3vw, 2rem);
            font-weight: 700;
            margin-top: 2rem;
            margin-bottom: 1rem;
            color: var(--color-text);
        }
        p {
            font-size: 1.1rem;
            color: #5A5A5A;
            max-width: 480px;
            line-height: 1.7;
            margin-bottom: 2.5rem;
        }
        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.9rem 2.4rem;
            background: var(--color-primary);
            color: #fff;
            font-family: var(--font-body);
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 8px;
            transition: background 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 16px rgba(139, 37, 0, 0.2);
        }
        .btn-home:hover {
            background: #B83000;
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(139, 37, 0, 0.3);
        }
        .btn-home:active { transform: translateY(0); }
        .btn-home svg { width: 18px; height: 18px; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate { animation: fadeInUp 0.6s ease forwards; }
        .animate-delay { animation: fadeInUp 0.6s ease 0.15s forwards; opacity: 0; }
        .animate-delay-2 { animation: fadeInUp 0.6s ease 0.3s forwards; opacity: 0; }
    </style>
</head>
<body>
    <noscript><div style="position:fixed;inset:0;z-index:99999;background:#fff;display:flex;align-items:center;justify-content:center;font-family:sans-serif;text-align:center;padding:2rem"><div><h1 style="font-size:1.5rem;margin-bottom:1rem">⚠️ JavaScript отключён</h1><p><span class="t-ru">Для работы сайта необходимо включить JavaScript в настройках браузера.</span><span class="t-ky">Сайттын иштеши үчүн JavaScript иштетилиши керек.</span></p></div></div></noscript>
    <svg class="ornament animate" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="60" cy="60" r="55" fill="none" stroke="#8B2500" stroke-width="2"/>
        <circle cx="60" cy="60" r="40" fill="none" stroke="#C8963E" stroke-width="1.5"/>
        <circle cx="60" cy="60" r="25" fill="none" stroke="#8B2500" stroke-width="1"/>
        <circle cx="60" cy="60" r="10" fill="#C8963E" opacity="0.5"/>
        <line x1="60" y1="5" x2="60" y2="115" stroke="#8B2500" stroke-width="0.8" opacity="0.3"/>
        <line x1="5" y1="60" x2="115" y2="60" stroke="#8B2500" stroke-width="0.8" opacity="0.3"/>
        <line x1="21" y1="21" x2="99" y2="99" stroke="#C8963E" stroke-width="0.6" opacity="0.25"/>
        <line x1="99" y1="21" x2="21" y2="99" stroke="#C8963E" stroke-width="0.6" opacity="0.25"/>
    </svg>
    <div class="error-code animate">404</div>
    <h1 class="animate-delay">Страница не найдена</h1>
    <p class="animate-delay-2">Кажется, эта страница затерялась в степи. Вернитесь на главную и продолжите путешествие.</p>
    <a href="/" class="btn-home animate-delay-2">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        На главную
    </a>
</body>
</html>
