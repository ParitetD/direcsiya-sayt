# Nginx конфиг для aurora-sports
# Разместить в: /etc/nginx/sites-available/aurora-sports
# Включить: sudo ln -s /etc/nginx/sites-available/aurora-sports /etc/nginx/sites-enabled/
# SSL: sudo certbot --nginx -d ваш-домен.kg -d www.ваш-домен.kg

server {
    listen 80;
    server_name ваш-домен.kg www.ваш-домен.kg;
    # Certbot добавит redirect на HTTPS автоматически
}

server {
    listen 443 ssl;
    server_name ваш-домен.kg www.ваш-домен.kg;

    # SSL (certbot заполнит эти пути)
    ssl_certificate     /etc/letsencrypt/live/ваш-домен.kg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ваш-домен.kg/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Безопасность
    add_header X-Content-Type-Options   nosniff;
    add_header X-Frame-Options          SAMEORIGIN;
    add_header Referrer-Policy          strict-origin-when-cross-origin;

    # Статические файлы (CSS, JS, изображения) — кэшировать у клиента
    location ~* \.(css|js|png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_cache_valid  200 30d;
        expires            30d;
        add_header Cache-Control "public, immutable";
    }

    # Загруженные файлы
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        expires 7d;
    }

    # Всё остальное → Node.js
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # Максимальный размер загружаемых файлов
    client_max_body_size 10M;
}
